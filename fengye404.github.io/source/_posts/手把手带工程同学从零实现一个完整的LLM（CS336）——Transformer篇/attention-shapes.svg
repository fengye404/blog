<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="529" rx="10" fill="#fafbfc" stroke="#d0d7de"/>

  <rect x="220" y="26" width="200" height="38" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="320" y="45" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#24292f">x (B, S, D)</text>

  <line x1="320" y1="64" x2="320" y2="102" stroke="#57606a" marker-end="url(#a)"/>
  <text x="332" y="83" font-size="12" fill="#57606a" dominant-baseline="middle">W_Q / W_K / W_V</text>

  <rect x="220" y="102" width="200" height="38" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="320" y="121" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#24292f">q, k, v (B, H, S, d)</text>
  <text x="450" y="121" font-size="12" fill="#57606a" dominant-baseline="middle">H 个头独立算，d = D / H</text>

  <line x1="320" y1="140" x2="320" y2="178" stroke="#57606a" marker-end="url(#a)"/>
  <text x="332" y="159" font-size="12" fill="#57606a" dominant-baseline="middle">q · kᵀ / √d</text>

  <rect x="220" y="178" width="200" height="38" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="320" y="197" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#24292f">scores (B, H, S, S)</text>
  <text x="450" y="197" font-size="12" fill="#57606a" dominant-baseline="middle">每个头一张 S × S 分数表</text>

  <line x1="320" y1="216" x2="320" y2="254" stroke="#57606a" marker-end="url(#a)"/>
  <text x="332" y="235" font-size="12" fill="#57606a" dominant-baseline="middle">下三角 mask + softmax</text>

  <rect x="220" y="254" width="200" height="38" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="320" y="273" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#24292f">weights (B, H, S, S)</text>
  <text x="450" y="273" font-size="12" fill="#57606a" dominant-baseline="middle">每行和为 1，被掩掉的是 0</text>

  <line x1="320" y1="292" x2="320" y2="330" stroke="#57606a" marker-end="url(#a)"/>
  <text x="332" y="311" font-size="12" fill="#57606a" dominant-baseline="middle">weights · v</text>

  <rect x="220" y="330" width="200" height="38" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="320" y="349" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#24292f">out (B, H, S, d)</text>
  <text x="450" y="349" font-size="12" fill="#57606a" dominant-baseline="middle">每个头拿到加权后的上下文</text>

  <line x1="320" y1="368" x2="320" y2="406" stroke="#57606a" marker-end="url(#a)"/>
  <text x="332" y="387" font-size="12" fill="#57606a" dominant-baseline="middle">transpose + reshape + out_proj</text>

  <rect x="220" y="406" width="200" height="38" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="320" y="425" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#24292f">(B, S, D)</text>
  <text x="450" y="425" font-size="12" fill="#57606a" dominant-baseline="middle">拼回头维度，回到主干的形状</text>

  <text x="220" y="490" font-size="12" fill="#57606a">注意：全程只有 H 个头在并行，batch 和序列长度不变。</text>
</svg>
